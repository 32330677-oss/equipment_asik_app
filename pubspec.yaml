name: equipment_asik_app
description: "Equipment Flow (ASIK) - rented machinery attendance, paper timesheets, live board and vendor payroll."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  file_selector: ^1.1.0
  printing: ^5.15.0
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
  assets:
    - assets/images/logo.png
